[build]
	command = "npm run build"
	publish = "dist"

[build.environment]
	NODE_VERSION = "22"

# Service request forms are static HTML with data-netlify="true"
# so Netlify can detect the "service-request" form at deploy time.

[[redirects]]
	from = "https://www.goatgaragedoorindy.com/*"
	to = "https://goatgaragedoorindy.com/:splat"
	status = 301
	force = true

# Pages removed in the site restructure — 301 to the homepage to preserve link equity.
[[redirects]]
	from = "/services/garage-door-repair"
	to = "/"
	status = 301
	force = true

[[redirects]]
	from = "/services/emergency-garage-door-repair"
	to = "/"
	status = 301
	force = true

[[redirects]]
	from = "/service-areas/fishers"
	to = "/"
	status = 301
	force = true

[[headers]]
	for = "/*"
	[headers.values]
		X-Frame-Options = "SAMEORIGIN"
		X-Content-Type-Options = "nosniff"
		Referrer-Policy = "strict-origin-when-cross-origin"
		Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
	for = "/_astro/*"
	[headers.values]
		Cache-Control = "public, max-age=31536000, immutable"
